<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login · Skalantech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
      <div class="flash flash--{{ category }}" style="margin-bottom:1rem">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="eyebrow" style="justify-content:center;margin-bottom:1rem"><span class="status-dot"></span> SKALANTECH</div>
    <h1 style="text-align:center">Admin Login</h1>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <span>Benutzername</span>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <span>Passwort</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--primary btn--block" style="margin-top:0.5rem">Anmelden</button>
    </form>

    <a href="{{ url_for('index') }}" class="auth-back">← Zurück zur Startseite</a>
  </div>
</div>

</body>
</html>
