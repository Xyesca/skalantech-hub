name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Zentraler Rate-Limit-Storage (Issue #4): Redis für die
      # Multi-Worker-Sharing-Tests in tests/test_ratelimit_storage.py
      # (Test-DB 15; der Rest der Suite ist hermetisch via memory://).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall app tests
      - name: Run regression tests
        env:
          FLASK_ENV: development
          SECRET_KEY: ci-secret-not-for-production
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-password
        run: python -m unittest discover -v
