# ═══════════════════════════════════════════════════════════════════════════
# Skalantech Hub — PostgreSQL-Overlay (Issue #5)
#
# NUR intern vorbereitet: SQLite bleibt kurzfristig produktiv, der
# Default-Stack (`docker compose up -d`) bleibt unverändert (redis +
# skalantech). Dieser Service wird ausschließlich explizit geladen:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d postgres
#
# Sicherheit: bindet NUR an 127.0.0.1 (listen_addresses + network_mode:
# host, wie redis) — kein öffentlicher Port, keine Tailscale-Exposition.
# Einziger Client ist der skalantech-Container (DATABASE_URL, Host-Netz
# → 127.0.0.1:5432).
#
# POSTGRES_PASSWORD ist PFLICHT (verhindert versehentliches Starten mit
# Default-Passwort). Werte kommen aus .env (siehe .env.example).
# ═══════════════════════════════════════════════════════════════════════════
services:
  postgres:
    image: postgres:16-alpine
    container_name: skalantech-postgres
    restart: unless-stopped
    network_mode: host
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-skalantech}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      - POSTGRES_DB=${POSTGRES_DB:-skalantech}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-skalantech} -d ${POSTGRES_DB:-skalantech}"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
