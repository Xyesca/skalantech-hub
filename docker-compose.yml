services:
  skalantech:
    build:
      context: .
      network: host  # VPS-Quirk: DOCKER-USER-Kette blockt Build-DNS, Host-Netz umgeht das
    container_name: skalantech
    restart: unless-stopped
    network_mode: host  # Zugriff auf Host-localhost (n8n :5678); Caddy (Host) erreicht Container direkt über 127.0.0.1:5000
    volumes:
      - ./instance:/app/instance
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - CRM_API_KEY=${CRM_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
