services:
  skalantech:
    build: .
    container_name: skalantech
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./instance:/app/instance
      - ./.env:/app/.env:ro
    environment:
      - PORT=5000
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - apps_default

networks:
  apps_default:
    external: true
