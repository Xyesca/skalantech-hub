services:
  skalantech:
    build:
      context: .
      network: host  # VPS-Quirk: DOCKER-USER-Kette blockt Build-DNS, Host-Netz umgeht das
    container_name: skalantech
    restart: unless-stopped
    expose:
      - "5000"
    ports:
      - "127.0.0.1:5000:5000"  # nur localhost — Caddy (Host) proxied auf diese Adresse
    volumes:
      - ./instance:/app/instance
    environment:
      - PORT=5000
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - apps_default

networks:
  apps_default:
    external: true
