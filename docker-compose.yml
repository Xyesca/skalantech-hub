services:
  redis:
    image: redis:7-alpine
    container_name: skalantech-redis
    restart: unless-stopped
    # Host-Netzwerk wie die App; Redis lauscht NUR auf 127.0.0.1 (kein
    # öffentlicher Port, keine Tailscale-Exposition) — einziger Client ist
    # der skalantech-Container (RATELIMIT_STORAGE_URI, Issue #4).
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  skalantech:
    build:
      context: .
      network: host  # VPS-Quirk: DOCKER-USER-Kette blockt Build-DNS, Host-Netz umgeht das
    container_name: skalantech
    restart: unless-stopped
    network_mode: host  # Zugriff auf Host-localhost (n8n :5678); Caddy (Host) erreicht Container direkt über 127.0.0.1:5000
    # gunicorn NUR auf localhost binden — kein 0.0.0.0 (kein öffentlicher
    # Listen-Port, falls UFW je ausfällt). Caddy proxyt von 127.0.0.1:5000.
    command: ["gunicorn", "-w", "4", "-b", "127.0.0.1:5000", "--access-logfile", "-", "run:app"]
    volumes:
      - ./instance:/app/instance
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - DATABASE_URL=${DATABASE_URL:-}
      - CRM_API_KEY=${CRM_API_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://127.0.0.1:5678/webhook/skalantech-termin}
      - N8N_LEAD_WEBHOOK_URL=${N8N_LEAD_WEBHOOK_URL:-http://127.0.0.1:5678/webhook/lead-erfassung}
      - N8N_DEMO_BASE_URL=${N8N_DEMO_BASE_URL:-http://127.0.0.1:5678/webhook}
      - BUSINESS_EMAIL=${BUSINESS_EMAIL:-xyesca@skalantech.store}
      - IONOS_SMTP_HOST=${IONOS_SMTP_HOST:-smtp.ionos.de}
      - IONOS_SMTP_PORT=${IONOS_SMTP_PORT:-465}
      - IONOS_IMAP_HOST=${IONOS_IMAP_HOST:-imap.ionos.de}
      - IONOS_IMAP_PORT=${IONOS_IMAP_PORT:-993}
      - IONOS_MAIL_USER=${IONOS_MAIL_USER:-xyesca@skalantech.store}
      - IONOS_MAIL_PASSWORD=${IONOS_MAIL_PASSWORD}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL (Issue #5) — NUR intern vorbereitet, NICHT Teil des
  # Default-Stacks: SQLite bleibt kurzfristig produktiv. Der Service startet
  # nur explizit via `docker compose --profile postgres up -d postgres`
  # (Staging/Preview/Migration). Bindet ausschließlich an 127.0.0.1 — kein
  # öffentlicher Port, keine Tailscale-Exposition; einziger Client ist der
  # skalantech-Container (DATABASE_URL, Host-Netzwerk → 127.0.0.1:5432).
  postgres:
    image: postgres:16-alpine
    container_name: skalantech-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    network_mode: host
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-skalantech}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      - POSTGRES_DB=${POSTGRES_DB:-skalantech}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-skalantech} -d ${POSTGRES_DB:-skalantech}"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
  postgres-data:
