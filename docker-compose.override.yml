services:
  skalantech:
    network_mode: bridge
    command: ["gunicorn", "-w", "4", "-b", "0.0.0.0:5000", "--access-logfile", "-", "run:app"]
    ports:
      - "5000:5000"

  redis:
    network_mode: bridge
    command: ["redis-server", "--bind", "0.0.0.0", "--port", "6379", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"